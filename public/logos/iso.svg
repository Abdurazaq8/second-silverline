<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" fill="none">
  <!-- Drop Shadow Filter -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#101b22" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdc23e"/>
      <stop offset="100%" stop-color="#e5a920"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101b22"/>
      <stop offset="100%" stop-color="#1d2f3a"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="20" y="16" width="360" height="328" rx="16" fill="#ffffff" stroke="#101b22" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Top Header Ribbon -->
  <path d="M 22 32 C 22 23 29 18 38 18 L 362 18 C 371 18 378 23 378 32 L 378 74 L 22 74 Z" fill="url(#blueGrad)"/>
  
  <!-- Top Ribbon Text -->
  <text x="200" y="46" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#fdc23e" text-anchor="middle" letter-spacing="3.5">CERTIFIED STANDARDS</text>
  <text x="200" y="65" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">INTEGRATED MANAGEMENT SYSTEM</text>

  <!-- Main Center ISO Badge -->
  <g transform="translate(200, 150)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="62" fill="#ffffff" stroke="#101b22" stroke-width="4"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#fdc23e" stroke-width="2.5" stroke-dasharray="4 2"/>
    
    <!-- ISO Wordmark -->
    <text x="0" y="13" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" fill="#101b22" text-anchor="middle" letter-spacing="2">ISO</text>
  </g>

  <!-- Triple Certification Standards Strip -->
  <!-- Standard 1: ISO 9001 (Quality) -->
  <g transform="translate(42, 230)">
    <rect x="0" y="0" width="96" height="52" rx="4" fill="#f0f6f8" stroke="#101b22" stroke-width="2"/>
    <rect x="0" y="0" width="96" height="6" fill="#fdc23e"/>
    <text x="48" y="27" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#101b22" text-anchor="middle">9001</text>
    <text x="48" y="43" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#535c62" text-anchor="middle" letter-spacing="0.8">QUALITY</text>
  </g>

  <!-- Standard 2: ISO 14001 (Environment) -->
  <g transform="translate(152, 230)">
    <rect x="0" y="0" width="96" height="52" rx="4" fill="#f0f6f8" stroke="#101b22" stroke-width="2"/>
    <rect x="0" y="0" width="96" height="6" fill="#10b981"/>
    <text x="48" y="27" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#101b22" text-anchor="middle">14001</text>
    <text x="48" y="43" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#535c62" text-anchor="middle" letter-spacing="0.8">ENVIRONMENT</text>
  </g>

  <!-- Standard 3: ISO 45001 (Health & Safety) -->
  <g transform="translate(262, 230)">
    <rect x="0" y="0" width="96" height="52" rx="4" fill="#f0f6f8" stroke="#101b22" stroke-width="2"/>
    <rect x="0" y="0" width="96" height="6" fill="#3b82f6"/>
    <text x="48" y="27" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#101b22" text-anchor="middle">45001</text>
    <text x="48" y="43" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#535c62" text-anchor="middle" letter-spacing="0.8">HEALTH &amp; SAFETY</text>
  </g>

  <!-- Bottom Verification Bar -->
  <g transform="translate(200, 316)">
    <text x="0" y="0" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#101b22" text-anchor="middle" letter-spacing="2">INTERNATIONAL SPECIFICATIONS COMPLIANT</text>
  </g>
</svg>
